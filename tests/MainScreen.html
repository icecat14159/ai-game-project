<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 遊戲帳號與存檔系統</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JavaScript SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- 頂部浮動存檔與狀態提示 (Toast) -->
    <div id="save-toast" class="toast hidden" role="status" aria-live="polite">當前狀態已儲存</div>

    <!-- 遊戲主畫面 -->
    <main id="play-area">
        <!-- 頂部操作列 (電腦與手機雙向自適應) -->
        <header class="header-bar">
            <div class="header-left">
                <span id="player-label">遊客（未綁定）</span>
                <button type="button" id="btn-manual-save" class="text-btn hidden" title="立即將當前座標儲存至雲端">💾 <span class="btn-label">手動存檔</span></button>
                <button type="button" id="btn-settings" class="text-btn hidden" title="帳號與遊戲設置">⚙️ <span class="btn-label">設定</span></button>
            </div>
            <div class="header-right">
                <!-- 座標與地圖資訊 (即時更新) -->
                <div id="coord-hud" class="coord-badge" title="大地圖座標">📍 X: 0, Y: 0</div>
                <button type="button" id="btn-open-auth">登入 / 註冊</button>
                <button type="button" id="btn-signout" class="hidden">登出</button>
            </div>
        </header>

        <!-- 遊戲畫布容器 -->
        <div class="stage-wrapper">
            <canvas id="stage" width="800" height="600" tabindex="0"></canvas>
            
            <!-- 手機虛擬控制方向鍵 (僅在觸控/手機裝置或小螢幕顯示) -->
            <div id="touch-controller" class="touch-controller" aria-label="手機虛擬方向鍵">
                <div class="dpad-center">
                    <button type="button" class="dpad-btn dpad-up" data-dir="up" aria-label="向上移動">▲</button>
                    <button type="button" class="dpad-btn dpad-left" data-dir="left" aria-label="向左移動">◀</button>
                    <button type="button" class="dpad-btn dpad-down" data-dir="down" aria-label="向下移動">▼</button>
                    <button type="button" class="dpad-btn dpad-right" data-dir="right" aria-label="向右移動">▶</button>
                    <div class="dpad-core"></div>
                </div>
            </div>
        </div>

        <!-- 電腦版鍵盤操作提示 -->
        <footer class="controls-hint">
            <span>🎮 移動控制：<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 或 <kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd>｜支援手機虛擬方向鍵</span>
        </footer>
    </main>

    <!-- 帳號登入 / 註冊 彈出視窗 (電腦為中央對話框，手機自動轉為底部抽屜式面板) -->
    <div id="auth-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
        <section class="modal-panel">
            <!-- 手機版抽屜頂部手柄 -->
            <div class="drawer-handle" aria-hidden="true"></div>

            <div class="modal-header">
                <h2 id="auth-modal-title">帳號系統</h2>
                <button type="button" id="btn-close-auth" class="close-btn" aria-label="關閉視窗">✕</button>
            </div>
            
            <!-- 第三方快捷登入 (Google OAuth) -->
            <div class="oauth-section">
                <button type="button" id="btn-google-auth" class="google-btn" title="使用 Google 帳號授權快速登入">
                    <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>使用 Google 帳號快速登入</span>
                </button>
            </div>

            <!-- 分隔線 -->
            <div class="form-divider" aria-hidden="true">
                <span>或使用自訂遊戲帳號</span>
            </div>

            <!-- 頁籤切換：登入 / 註冊 -->
            <div class="tabs">
                <button type="button" id="tab-login" class="tab-btn active">帳號登入</button>
                <button type="button" id="tab-register" class="tab-btn">建立新帳號</button>
            </div>

            <!-- 輸入表單 -->
            <form id="auth-form" class="modal-form" onsubmit="return false;">
                <input type="text" id="input-account" placeholder="輸入遊戲帳號 (支援中文、英數)" autocomplete="username" required>
                <p class="warning-text">⚠️ 提醒：請勿輸入真實姓名或常用個人密碼等敏感資料</p>
                <input type="password" id="input-pass" placeholder="輸入密碼 (至少 6 位數)" autocomplete="current-password" required>
                
                <!-- 註冊專用欄位 (預設隱藏) -->
                <input type="password" id="input-pass-confirm" class="hidden" placeholder="再次確認密碼" autocomplete="new-password">
                
                <div class="action-row">
                    <button type="submit" id="btn-submit-auth" class="primary-btn">登入</button>
                </div>
            </form>
            <div id="status-text" role="alert"></div>
        </section>
    </div>

    <!-- 系統設定 彈出視窗 (電腦為中央對話框，手機自動轉為底部抽屜式面板) -->
    <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
        <section class="modal-panel profile-panel">
            <!-- 手機版抽屜頂部手柄 -->
            <div class="drawer-handle" aria-hidden="true"></div>

            <div class="modal-header">
                <h2 id="settings-modal-title">系統設定</h2>
                <button type="button" id="btn-close-settings" class="close-btn" aria-label="關閉視窗">✕</button>
            </div>
            
            <!-- 設定頁籤：玩家資訊 / 遊戲設置 -->
            <div class="tabs">
                <button type="button" id="tab-profile" class="tab-btn active">玩家資訊</button>
                <button type="button" id="tab-game-settings" class="tab-btn">遊戲設置</button>
            </div>

            <!-- 頁籤內容：玩家資訊 (預設顯示) -->
            <div id="content-profile" class="tab-content active">
                <div class="profile-content">
                    <p><strong>遊戲名稱：</strong><span id="profile-display-name">-</span></p>
                    <p><strong>帳號狀態：</strong><span id="profile-account-status">已綁定正式帳號</span></p>
                </div>
                <hr class="divider">
                
                <!-- Google 登入專用免密碼提示 (預設隱藏) -->
                <div id="google-account-notice" class="google-notice hidden">
                    <p>ℹ️ 目前以 <strong>Google 帳號</strong> 授權登入，無須在本站設定密碼；如需安全管理請至 Google 帳戶設定。</p>
                </div>

                <!-- 遊戲自訂帳號專用密碼修改表單 -->
                <form id="password-form" class="password-change-section" onsubmit="return false;">
                    <h3>變更密碼</h3>
                    <input type="password" id="input-old-pass" placeholder="輸入當前密碼" autocomplete="current-password" required>
                    <input type="password" id="input-new-pass" placeholder="輸入新密碼 (至少 6 位數)" autocomplete="new-password" required>
                    <input type="password" id="input-new-pass-confirm" placeholder="再次確認新密碼" autocomplete="new-password" required>
                    <button type="submit" id="btn-change-pass" class="secondary-btn">確認修改密碼</button>
                    <div id="profile-status-text" role="alert"></div>
                </form>
            </div>

            <!-- 頁籤內容：遊戲設置 -->
            <div id="content-game-settings" class="tab-content">
                <div class="setting-item">
                    <label for="select-autosave">自動存檔間隔：</label>
                    <select id="select-autosave">
                        <option value="5000">每 5 秒</option>
                        <option value="10000">每 10 秒</option>
                        <option value="30000">每 30 秒</option>
                        <option value="60000">每 60 秒</option>
                        <option value="0">關閉自動存檔</option>
                    </select>
                </div>
                <p class="hint-text">💡 設定會自動儲存至雲端，下次登入將自動載入。</p>
            </div>
        </section>
    </div>

    <!-- 核心腳本載入順序：遊戲引擎 -> 認證模組 -> 存檔與同步模組 -->
    <script src="game.js"></script>
    <script src="auth.js"></script>
    <script src="save.js"></script>
</body>
</html>
