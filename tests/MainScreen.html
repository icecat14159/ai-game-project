<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁遊戲 - 登入與移動系統</title>
    <link rel="stylesheet" href="style.css">
    <!-- 載入 Supabase 官方 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- 帳號驗證面板 (預設顯示) -->
    <section id="login-panel">
        <h2>玩家認證</h2>
        <input type="email" id="input-email" placeholder="輸入電子信箱" autocomplete="email">
        <input type="password" id="input-pass" placeholder="輸入密碼 (至少 6 位數)" autocomplete="current-password">
        <div class="action-row">
            <button type="button" id="btn-signin">登入</button>
            <button type="button" id="btn-register">註冊</button>
        </div>
        <div id="status-text"></div>
    </section>

    <!-- 遊戲主畫面 (預設隱藏，登入後開啟) -->
    <main id="play-area" class="hidden">
        <header class="header-bar">
            <span id="player-label"></span>
            <button type="button" id="btn-signout">登出系統</button>
        </header>
        <canvas id="stage" width="800" height="600"></canvas>
    </main>

    <script src="main.js"></script>
</body>
</html>
